[package]
name = "miaovps-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MiaoVPS 桌面客户端"

[lib]
name = "miaovps_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
miaovps-app.path = "../../../crates/miaovps-app"
miaovps-core.path = "../../../crates/miaovps-core"
miaovps-provisioner.path = "../../../crates/miaovps-provisioner"
miaovps-storage.path = "../../../crates/miaovps-storage"
miaovps-wireguard-config.path = "../../../crates/miaovps-wireguard-config"

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
x25519-dalek.workspace = true
