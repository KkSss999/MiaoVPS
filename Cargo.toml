[workspace]
resolver = "2"
members = [
    "crates/miaovps-core",
    "crates/miaovps-wireguard-config",
    "crates/miaovps-ssh",
    "crates/miaovps-provisioner",
    "crates/miaovps-tunnel-api",
    "crates/miaovps-telemetry",
    "crates/miaovps-storage",
    "crates/miaovps-connect",
    "crates/miaovps-app",
    "crates/miaovps-cli",
    "crates/miaovps-control",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["MiaoVPS"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
boringtun = "0.7"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }

# SSH
russh = "0.45"
russh-keys = "0.45"

# Storage
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
keyring = "3"

# WebSocket
tokio-tungstenite = "0.24"

# QR
qrcode = "0.14"

# 私有云控制面
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
argon2 = "0.5"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Tauri (only for desktop app — not in workspace deps)
