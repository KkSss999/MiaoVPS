name: Release

# 版本号只有一个来源：Cargo.toml 的 [workspace.package] version。
# 改版本号并推到 main 即发布：tag v<version> 不存在就创建，
# release 不存在就构建三个目标并挂上去。重复推送不会重复发布。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  version:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      released: ${{ steps.state.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: read
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -1)
          test -n "$version" || { echo "无法从 Cargo.toml 读取版本号"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "版本: v$version"

      - id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.read.outputs.version }}"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag 已存在，跳过打 tag"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
            echo "已创建 $tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "$tag 的 release 已存在，跳过构建"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.released == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p miaovps-cli --target ${{ matrix.target }}

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          name="miaovps-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/miaovps" LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: miaovps-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      # gh release create 需要仓库上下文和完整的 tag 历史（--generate-notes
      # 要拿上一个 tag 做区间）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/*.tar.gz \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
